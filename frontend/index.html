<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
    <meta name="description" content="CarbonAI 时空智能碳管理平台 V5.2 — 碳排放核算、GIS碳源热力图、轨迹碳足迹、多标准报告、AI碳管理顾问" />
    <title>CarbonAI V5.2 · 时空智能碳管理平台</title>
    <!-- 深色主题：Vue 主包加载前显示，mount 后由根组件覆盖 -->
    <style>
      body { margin: 0; background: #070d0b; color: #e8f5ef; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; }
      .boot-top { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid #1c2f27; }
      .boot-logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #10b981, #0ea5e9); }
      .boot-title { width: 180px; height: 16px; border-radius: 4px; background: #16261f; }
      .boot-sub { width: 120px; height: 10px; border-radius: 3px; background: #16261f; margin-top: 6px; }
      .boot-body { flex: 1; display: flex; padding: 24px; gap: 16px; }
      .boot-side { width: 200px; display: flex; flex-direction: column; gap: 12px; }
      .boot-side > div { height: 36px; border-radius: 8px; background: #16261f; }
      .boot-side > div:first-child { height: 48px; width: 160px; }
      .boot-main { flex: 1; display: flex; flex-direction: column; gap: 16px; }
      .boot-main > div { height: 280px; border-radius: 10px; background: #16261f; }
      .boot-main > div:first-child { height: 120px; }
      .boot-short { height: 100px !important; }
      .boot * { animation: shimmer 1.6s ease-in-out infinite; }
      @keyframes shimmer { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 首屏骨架屏（纯 HTML + CSS，Vue 挂载后自动覆盖） -->
      <div class="boot">
        <div class="boot-top">
          <div class="boot-logo"></div>
          <div>
            <div class="boot-title"></div>
            <div class="boot-sub"></div>
          </div>
        </div>
        <div class="boot-body">
          <div class="boot-side">
            <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
          </div>
          <div class="boot-main">
            <div></div><div></div><div class="boot-short"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
