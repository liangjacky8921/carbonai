# CarbonAI 生产环境 Nginx 配置（阿里云 ECS Ubuntu 22.04）
# HTTP → HTTPS 跳转 + Let's Encrypt 证书（certbot webroot 模式）
# 证书续期：certbot systemd timer 自动执行；续期后 certbot 会自动 reload 或手动 systemctl reload nginx

server {
    listen 80;
    server_name carbontool.cn www.carbontool.cn;

    # ACME http-01 验证（证书续期用，必须保留在 80 端口）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 其余请求全部 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name carbontool.cn www.carbontool.cn;

    ssl_certificate     /etc/letsencrypt/live/carbontool.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carbontool.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/carbonai/frontend/dist;
    index index.html;

    # index.html 禁止缓存：部署新版本后用户立即拿到新页面引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 产物自带 hash，可安全缓存 7 天）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 接口反向代理到 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
